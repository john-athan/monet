<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Monet: Suche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3D6FB0}a:hover{color:#22305E}
.m{--ground:#EEF2EA;--surface:#FAFBF5;--surface-2:#E0E8DA;--surface-3:#CFDAC8;--ink:#22305E;--muted:#55617E;--rule:#D2DCCB;--sun:#EE7A2F;--sun-ink:#A44A12;--water:#3D6FB0;--water-soft:#D9E4F1;--on-ink:#FAFBF5;--glass:rgb(250 251 245 / .86);--veil:rgb(34 48 94 / .52);--deep:#1A1E44;--shadow:0 1px 2px rgb(34 48 94 / .1),0 14px 34px -14px rgb(34 48 94 / .3);--teich:#2F7F86;--esszimmer:#E2AE1C;--garten:#4C8A52;--atelier:#C8707A;--font-display:Didot,"Bodoni 72","Bodoni MT","Iowan Old Style",ui-serif,Georgia,serif;--font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--ground);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;color-scheme:light}
.m[data-light=morgen]{--ground:#F5ECEB;--surface:#FCF8F6;--surface-2:#ECDFE1;--surface-3:#E0CDD1;--ink:#2E2B5C;--muted:#625C86;--rule:#E2D3D7;--sun:#E8743B;--sun-ink:#A2461A;--water:#5A6FB8;--water-soft:#E1E3F3;--on-ink:#FCF8F6;--glass:rgb(252 248 246 / .86);--veil:rgb(46 43 92 / .5);--shadow:0 1px 2px rgb(46 43 92 / .1),0 14px 34px -14px rgb(46 43 92 / .3)}
.m[data-light=abend]{--ground:#F6E4D5;--surface:#FDF4EC;--surface-2:#EFD5C3;--surface-3:#E5C2AC;--ink:#3B2553;--muted:#6C5470;--rule:#E8CDBA;--sun:#D9532A;--sun-ink:#9E3513;--water:#5E58A8;--water-soft:#E9DFF0;--on-ink:#FDF4EC;--glass:rgb(253 244 236 / .86);--veil:rgb(59 37 83 / .5);--shadow:0 1px 2px rgb(59 37 83 / .1),0 14px 34px -14px rgb(59 37 83 / .3)}
.m[data-light=nacht]{--ground:#1C2049;--surface:#252A58;--surface-2:#2F3569;--surface-3:#3A417A;--ink:#F2EBE1;--muted:#B0ABCF;--rule:#363D72;--sun:#FF9A52;--sun-ink:#FFB07A;--water:#9DB3EE;--water-soft:#2E3A72;--on-ink:#1C2049;--glass:rgb(37 42 88 / .86);--veil:rgb(12 14 40 / .55);--deep:#12153A;--shadow:0 1px 2px rgb(8 10 30 / .4),0 18px 44px -18px rgb(8 10 30 / .8);--teich:#6FC3C4;--esszimmer:#F5CF4E;--garten:#86C48A;--atelier:#F0A0A8;color-scheme:dark}
@media (prefers-color-scheme: dark){.m[data-light=auto]{--ground:#1C2049;--surface:#252A58;--surface-2:#2F3569;--surface-3:#3A417A;--ink:#F2EBE1;--muted:#B0ABCF;--rule:#363D72;--sun:#FF9A52;--sun-ink:#FFB07A;--water:#9DB3EE;--water-soft:#2E3A72;--on-ink:#1C2049;--glass:rgb(37 42 88 / .86);--veil:rgb(12 14 40 / .55);--deep:#12153A;--shadow:0 1px 2px rgb(8 10 30 / .4),0 18px 44px -18px rgb(8 10 30 / .8);--teich:#6FC3C4;--esszimmer:#F5CF4E;--garten:#86C48A;--atelier:#F0A0A8;color-scheme:dark}}
.m,.m *{box-sizing:border-box}
.m a{text-decoration:none}
.m button,.m input{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.m h1,.m h2,.m h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:0}
.m p{margin:0}
.m .tnum{font-variant-numeric:tabular-nums}
.m .tile:hover{filter:brightness(1.06)}
.m .tab{color:var(--muted)}
.m .tab:hover{color:var(--ink)}
.m .x:hover{background:var(--surface-3)}
.m .more:hover{background:var(--surface-2)}
.m input::placeholder{color:var(--muted)}
</style>
</helmet>
<div class="m" data-light="{{licht}}" style="position: relative; width: 390px; height: 844px; overflow: hidden">

  <header style="padding: 18px 14px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="Phone-Fotos.dc.html" aria-label="Zurück zu Fotos" style="width: 40px; height: 44px; display: grid; place-items: center; color: var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <label style="flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; border-radius: 24px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--water)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="color: var(--muted); flex: none"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20.5 20.5"></path></svg>
        <input type="search" aria-label="Fotos durchsuchen" value="oma im schnee 2019" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px">
        <button type="button" class="x" aria-label="Suche leeren" style="width: 36px; height: 36px; flex: none; border: 0; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </label>
    </div>

    <div role="list" aria-label="So hat Monet die Suche verstanden" style="display: flex; flex-wrap: wrap; gap: 8px; padding-left: 46px">
      <span role="listitem" style="display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 4px 0 4px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-size: 14px; font-weight: 650">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: {{faceOma}}"></span>Oma
        <button type="button" class="x" aria-label="Filter Oma entfernen" style="width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--muted)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span role="listitem" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 4px 0 12px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); font-size: 14px; font-weight: 650">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>2019
        <button type="button" class="x" aria-label="Filter 2019 entfernen" style="width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--muted)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
      <span role="listitem" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 4px 0 12px; border-radius: 18px; background: var(--water-soft); font-size: 14px; font-weight: 650">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M4 18l5-4.5 3.5 3 3-2.5 4.5 4"></path></svg>im Schnee
        <button type="button" class="x" aria-label="Bildinhalt im Schnee entfernen" style="width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--muted)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </span>
    </div>
  </header>

  <section aria-label="Treffer" style="padding-top: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px 10px">
      <h2 class="tnum" style="font-size: 26px; line-height: 1">23 Fotos</h2>
      <div role="group" aria-label="Sortierung" style="display: flex; padding: 3px; border-radius: 17px; background: var(--surface-2)">
        <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: var(--surface); box-shadow: 0 1px 2px rgb(34 48 94 / .14); font-size: 13px; font-weight: 650">Beste Treffer</button>
        <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; font-weight: 650; color: var(--muted)">Nach Datum</button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <a href="Phone-Foto.dc.html" class="tile" aria-label="Bester Treffer: Oma im Schnee, 14. Februar 2015, Oberstdorf" style="grid-column: span 2; grid-row: span 2; display: block; aspect-ratio: 1; background: {{hero}}"></a>
      <sc-for list="{{results}}" as="p" hint-placeholder-count="8">
        <a href="Phone-Foto.dc.html" class="tile" aria-label="{{p.label}}" style="display: block; aspect-ratio: 1; background: {{p.bg}}"></a>
      </sc-for>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; padding: 10px 8px 0">
    <a href="Phone-Suche.dc.html" class="more" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; color: var(--ink)">
      <span style="display: flex">
        <span style="width: 40px; height: 40px; border-radius: 8px; background: {{relaxA}}; box-shadow: 0 0 0 2px var(--ground)"></span>
        <span style="width: 40px; height: 40px; border-radius: 8px; margin-left: -14px; background: {{relaxB}}; box-shadow: 0 0 0 2px var(--ground)"></span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-weight: 650">Im Schnee, ohne Oma</span>
        <span class="tnum" style="font-size: 13px; color: var(--muted)">112 weitere Fotos aus 2019</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>

  <nav aria-label="Bereiche" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 18px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--rule)">
    <a href="Phone-Fotos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink); font-size: 11.5px; font-weight: 650">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
      Fotos
      <span aria-hidden="true" style="position: relative; width: 26px; height: 6px"><span style="position: absolute; inset: 0; border-radius: 999px; background: var(--teich); transform: rotate(-4deg)"></span></span>
    </a>
    <a href="Phone-Personen.dc.html" class="tab" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 650">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"></path></svg>
      Personen
    </a>
    <a href="Phone-Fotos.dc.html" class="tab" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 650">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>
      Orte
    </a>
    <a href="Phone-Fotos.dc.html" class="tab" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 650">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="2"></rect><path d="M6.5 4h11"></path><path d="M3.5 16l4.5-4 4 3.5 3-2.5 5.5 4.5"></path></svg>
      Alben
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"licht":{"editor":"enum","options":["mittag","morgen","abend","nacht","auto"],"default":"mittag"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function face(o) {
      var s = o.s || 1, x = o.x || 50, y = o.y || 46, L = [];
      if (o.hat) L.push('radial-gradient(ellipse ' + (24 * s) + '% ' + (13 * s) + '% at ' + x + '% ' + (y - 17 * s) + '%, ' + o.hat + ' 0 95%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (18 * s) + '% ' + (22 * s) + '% at ' + x + '% ' + y + '%, ' + o.skin + ' 0 96%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (22 * s) + '% ' + (21 * s) + '% at ' + x + '% ' + (y - 9 * s) + '%, ' + o.hair + ' 0 96%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (40 * s) + '% ' + (28 * s) + '% at ' + x + '% ' + (y + 56 * s) + '%, ' + o.shirt + ' 0 96%, transparent 100%)');
      L.push(o.bg);
      return L.join(', ');
    }
    var snowBg = 'linear-gradient(180deg, transparent 0 58.0%, #F7F9FC 58.0%, #DCE3EC 100%), conic-gradient(from 134deg at 30% 42.0%, #7E8BA0 0 92deg, transparent 92deg), conic-gradient(from 128deg at 68% 46.0%, #96A3B7 0 104deg, transparent 104deg), linear-gradient(180deg, #BCC9DA 0%, #E6ECF3 50%, #F7F9FC 60%, #DCE3EC 100%)';
    var forest = 'radial-gradient(ellipse 8% 24% at 20% 56%, #3E5A54 0 95%, transparent 100%), radial-gradient(ellipse 6% 18% at 34% 60%, #4A6660 0 95%, transparent 100%), radial-gradient(ellipse 7% 20% at 74% 58%, #3E5A54 0 95%, transparent 100%), linear-gradient(180deg, #C4CFDD 0%, #E9EEF4 55%, #F8FAFC 56%, #DFE6EE 100%)';
    var sled = 'radial-gradient(ellipse 20% 5% at 48% 76%, #B3263A 0 95%, transparent 100%), linear-gradient(170deg, #DDE5EF 0%, #F6F8FB 50%, #D3DCE7 100%)';
    var oma = { skin: '#E8C0A4', hair: '#D9DCE2', shirt: '#7A2E3A', hat: '#B3263A' };
    function o(extra) { var r = {}; for (var k in oma) r[k] = oma[k]; for (var k2 in extra) r[k2] = extra[k2]; return r; }
    return {
      licht: this.props.licht ?? 'mittag',
      faceOma: face({ skin: '#E8C0A4', hair: '#D9DCE2', shirt: '#7A2E3A', bg: 'linear-gradient(180deg, #C9D5E4, #EEF2F7)' }),
      hero: face(o({ bg: snowBg })),
      results: [
        { bg: face(o({ s: .6, x: 34, y: 58, bg: forest })), label: 'Oma im Schneewald, Februar 2015' },
        { bg: face(o({ s: .8, x: 60, y: 50, bg: snowBg })), label: 'Oma vor den Bergen, Februar 2015' },
        { bg: face(o({ s: .5, x: 46, y: 50, bg: sled })), label: 'Oma mit Schlitten, Januar 2019' },
        { bg: face(o({ s: .9, bg: 'linear-gradient(180deg, #DCE4EE, #F3F6FA)' })), label: 'Oma am Fenster, Schnee draußen, Februar 2019' },
        { bg: face(o({ s: .55, x: 62, y: 60, bg: forest })), label: 'Oma auf dem Winterweg, Februar 2015' }
      ],
      relaxA: forest,
      relaxB: snowBg
    };
  }
}
</script>
</body>
</html>
