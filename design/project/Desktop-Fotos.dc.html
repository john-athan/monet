<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Monet: Fotos am Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3D6FB0}a:hover{color:#22305E}
.m{--ground:#EEF2EA;--surface:#FAFBF5;--surface-2:#E0E8DA;--surface-3:#CFDAC8;--ink:#22305E;--muted:#55617E;--rule:#D2DCCB;--sun:#EE7A2F;--sun-ink:#A44A12;--water:#3D6FB0;--water-soft:#D9E4F1;--on-ink:#FAFBF5;--glass:rgb(250 251 245 / .86);--veil:rgb(34 48 94 / .52);--deep:#1A1E44;--shadow:0 1px 2px rgb(34 48 94 / .1),0 14px 34px -14px rgb(34 48 94 / .3);--teich:#2F7F86;--esszimmer:#E2AE1C;--garten:#4C8A52;--atelier:#C8707A;--font-display:Didot,"Bodoni 72","Bodoni MT","Iowan Old Style",ui-serif,Georgia,serif;--font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--ground);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;color-scheme:light}
.m[data-light=morgen]{--ground:#F5ECEB;--surface:#FCF8F6;--surface-2:#ECDFE1;--surface-3:#E0CDD1;--ink:#2E2B5C;--muted:#625C86;--rule:#E2D3D7;--sun:#E8743B;--sun-ink:#A2461A;--water:#5A6FB8;--water-soft:#E1E3F3;--on-ink:#FCF8F6;--glass:rgb(252 248 246 / .86);--veil:rgb(46 43 92 / .5);--shadow:0 1px 2px rgb(46 43 92 / .1),0 14px 34px -14px rgb(46 43 92 / .3)}
.m[data-light=abend]{--ground:#F6E4D5;--surface:#FDF4EC;--surface-2:#EFD5C3;--surface-3:#E5C2AC;--ink:#3B2553;--muted:#6C5470;--rule:#E8CDBA;--sun:#D9532A;--sun-ink:#9E3513;--water:#5E58A8;--water-soft:#E9DFF0;--on-ink:#FDF4EC;--glass:rgb(253 244 236 / .86);--veil:rgb(59 37 83 / .5);--shadow:0 1px 2px rgb(59 37 83 / .1),0 14px 34px -14px rgb(59 37 83 / .3)}
.m[data-light=nacht]{--ground:#1C2049;--surface:#252A58;--surface-2:#2F3569;--surface-3:#3A417A;--ink:#F2EBE1;--muted:#B0ABCF;--rule:#363D72;--sun:#FF9A52;--sun-ink:#FFB07A;--water:#9DB3EE;--water-soft:#2E3A72;--on-ink:#1C2049;--glass:rgb(37 42 88 / .86);--veil:rgb(12 14 40 / .55);--deep:#12153A;--shadow:0 1px 2px rgb(8 10 30 / .4),0 18px 44px -18px rgb(8 10 30 / .8);--teich:#6FC3C4;--esszimmer:#F5CF4E;--garten:#86C48A;--atelier:#F0A0A8;color-scheme:dark}
@media (prefers-color-scheme: dark){.m[data-light=auto]{--ground:#1C2049;--surface:#252A58;--surface-2:#2F3569;--surface-3:#3A417A;--ink:#F2EBE1;--muted:#B0ABCF;--rule:#363D72;--sun:#FF9A52;--sun-ink:#FFB07A;--water:#9DB3EE;--water-soft:#2E3A72;--on-ink:#1C2049;--glass:rgb(37 42 88 / .86);--veil:rgb(12 14 40 / .55);--deep:#12153A;--shadow:0 1px 2px rgb(8 10 30 / .4),0 18px 44px -18px rgb(8 10 30 / .8);--teich:#6FC3C4;--esszimmer:#F5CF4E;--garten:#86C48A;--atelier:#F0A0A8;color-scheme:dark}}
.m,.m *{box-sizing:border-box}
.m a{text-decoration:none}
.m button,.m input{font:inherit;color:inherit}
.m :focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.m h1,.m h2,.m h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:0}
.m p{margin:0}
.m .tnum{font-variant-numeric:tabular-nums}
.m .dab{position:absolute;border-radius:999px}
.m .nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;color:var(--muted);font-weight:600}
.m .nav:hover{background:var(--surface-2);color:var(--ink)}
.m .sub{display:block;padding:5px 10px;border-radius:8px;color:var(--ink);font-size:14px}
.m .sub:hover{background:var(--surface-2)}
.m .tile{position:relative;display:block;border:0;padding:0;cursor:pointer}
.m .tile:hover{filter:brightness(1.05)}
.m .act{height:40px;padding:0 14px;border:0;border-radius:20px;background:transparent;color:var(--on-ink);font-weight:600;display:inline-flex;align-items:center;gap:7px}
.m .act:hover{background:rgb(255 255 255 / .12)}

</helmet>
<div class="m" data-light="{{licht}}" style="position: relative; width: 100%; min-height: 900px; overflow: hidden">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 24px 10px">
    <a href="Desktop-Fotos.dc.html" style="display: flex; align-items: center; gap: 9px; width: 208px; color: var(--ink)">
      <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="14" r="6.6" fill="var(--sun)"></circle>
        <rect x="4" y="23.2" width="10" height="2.6" rx="1.3" fill="var(--water)" transform="rotate(-4 9 24.5)"></rect>
        <rect x="16.4" y="23.4" width="7.2" height="2.4" rx="1.2" fill="var(--sun)"></rect>
        <rect x="26" y="23" width="10.5" height="2.6" rx="1.3" fill="var(--teich)" transform="rotate(3 31 24.3)"></rect>
        <rect x="7" y="28.2" width="8.5" height="2.4" rx="1.2" fill="var(--teich)" transform="rotate(2 11 29.4)"></rect>
        <rect x="24.5" y="28" width="9" height="2.4" rx="1.2" fill="var(--atelier)" transform="rotate(-3 29 29.2)"></rect>
        <rect x="11" y="33" width="18" height="2.4" rx="1.2" fill="var(--water)" transform="rotate(-1.5 20 34.2)"></rect>
      </svg>
      <span style="font-family: var(--font-display); font-size: 27px; line-height: 1">Monet</span>
    </a>
    <label style="flex: 1 1 360px; max-width: 620px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="color: var(--muted); flex: none"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L20.5 20.5"></path></svg>
      <input type="search" aria-label="Fotos durchsuchen" placeholder="Personen, Orte, Dinge, Text in Bildern" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px">
      <kbd style="padding: 2px 7px; border-radius: 6px; background: var(--surface-2); font: 600 12px var(--font-body); color: var(--muted)">⌘K</kbd>
    </label>
    <span style="flex: 1"></span>
    <button type="button" class="ghost" aria-label="Licht: {{lichtName}}, folgt der Uhrzeit" style="height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted)">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: var(--sun)"></span>{{lichtName}}
    </button>
    <button type="button" class="ghost" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule); font-weight: 650">Importieren</button>
  </header>

  <section aria-label="Pinselband, die ganze Bibliothek" style="padding: 0 24px 6px">
    <div style="position: relative; height: 40px">
      <sc-for list="{{dabs}}" as="d" hint-placeholder-count="600">
        <span class="dab" style="{{d.s}}"></span>
      </sc-for>
      <span aria-hidden="true" style="position: absolute; right: -4px; top: -5px; width: 22px; height: 50px; border-radius: 8px; box-shadow: 0 0 0 2px var(--ink)"></span>
      <span aria-hidden="true" style="position: absolute; right: 2px; top: -12px; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 2px var(--ground)"></span>
    </div>
    <div class="tnum" style="display: flex; padding-top: 4px; font-size: 11.5px; color: var(--muted)">
      <sc-for list="{{years}}" as="yr" hint-placeholder-count="18">
        <span style="flex: {{yr.n}} 1 0; border-left: 1px solid var(--rule); padding-left: 4px">{{yr.y}}</span>
      </sc-for>
    </div>
  </section>

  <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 6px 14px 120px">
    <nav aria-label="Bereiche" style="flex: 1 1 220px; max-width: 232px; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 0">
      <a href="Desktop-Fotos.dc.html" class="nav" aria-current="page" style="color: var(--ink); position: relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
        <span style="position: relative">Fotos<span aria-hidden="true" class="dab" style="left: -2px; right: -6px; bottom: -3px; height: 6px; background: var(--teich); opacity: .7; transform: rotate(-3deg)"></span></span>
      </a>
      <a href="Desktop-Fotos.dc.html" class="nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"></path></svg>Personen
      </a>
      <a href="Desktop-Fotos.dc.html" class="nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>Orte
      </a>
      <a href="Desktop-Fotos.dc.html" class="nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="2"></rect><path d="M6.5 4h11"></path><path d="M3.5 16l4.5-4 4 3.5 3-2.5 5.5 4.5"></path></svg>Alben
      </a>

      <h2 style="font-size: 20px; padding: 20px 10px 4px">Serien</h2>
      <a href="Desktop-Fotos.dc.html" class="sub">Oberstdorf im Winter</a>
      <a href="Desktop-Fotos.dc.html" class="sub">Chiemsee, jeden Herbst</a>
      <a href="Desktop-Fotos.dc.html" class="sub">Noras Geburtstage</a>

      <h2 style="font-size: 20px; padding: 16px 10px 4px">Alben</h2>
      <a href="Desktop-Fotos.dc.html" class="sub">Italien 2023</a>
      <a href="Desktop-Fotos.dc.html" class="sub">Hochzeit Clara und Felix</a>
      <a href="Desktop-Fotos.dc.html" class="sub">Die Wohnung</a>

      <a href="Desktop-Geraete.dc.html" style="margin-top: 24px; display: flex; gap: 10px; padding: 12px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink); font-size: 13.5px; line-height: 1.35">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--water)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        <span><b style="font-weight: 650">Alles gesichert</b><br><span style="color: var(--muted)">Das MacBook analysiert gerade drei Fotos.</span></span>
      </a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
        <section style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px">
          <div style="display: flex; align-items: baseline; gap: 10px">
            <h2 style="font-size: 26px; line-height: 1.1; color: {{sec.sign}}">{{sec.title}}</h2>
            <span style="font-size: 14px; color: var(--muted)">{{sec.place}}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px">
            <sc-for list="{{sec.photos}}" as="p" hint-placeholder-count="6">
              <button type="button" class="tile" aria-pressed="{{p.pressed}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" style="flex: {{p.ar}} 1 {{p.basis}}px; aspect-ratio: {{p.ar}}; background: {{p.bg}}; box-shadow: {{p.ring}}">
                <span style="position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: {{p.dot}}; box-shadow: 0 0 0 1.5px #FBF8F2">
                  <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                  </sc-if>
                </span>
              </button>
            </sc-for>
            <span aria-hidden="true" style="flex: 40 1 0"></span>
          </div>
        </section>
      </sc-for>
    </main>
  </div>

  <div role="toolbar" aria-label="Auswahl" style="position: fixed; left: 50%; bottom: 28px; z-index: 5; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 20px; border-radius: 28px; background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow); white-space: nowrap">
    <span class="tnum" style="font-weight: 700; padding-right: 10px">{{count}} ausgewählt</span>
    <button type="button" class="act"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"></path><path d="M5 12v7.5h14V12"></path></svg>Teilen</button>
    <button type="button" class="act"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="2"></rect><path d="M12 10.5v6M9 13.5h6"></path></svg>Zum Album</button>
    <button type="button" class="act"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 19.5h14"></path></svg>Herunterladen</button>
    <button type="button" class="act"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"></path></svg>Löschen</button>
    <button type="button" class="act" aria-label="Auswahl beenden" style="width: 40px; padding: 0; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"licht":{"editor":"enum","options":["mittag","morgen","abend","nacht","auto"],"default":"mittag"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {

    var self = this;

    var P = [
      ['#9FB0CF', '#C9D3E6', '#7D7BB8'], ['#AEB9D2', '#E1E6F0', '#8C86BE'], ['#B9C49A', '#E5D9C8', '#9DAFD0'],
      ['#A8C886', '#F0C9D2', '#E8E2B0'], ['#86B86A', '#F2D46B', '#C9A3D9'], ['#7DAE5E', '#E9C24A', '#5E92C8'],
      ['#D9B44E', '#8DBB6A', '#4E86C2'], ['#3F7CB8', '#7FC2D6', '#F0D18A'], ['#BFA562', '#8EAE6B', '#D88E5A'],
      ['#CC7A3E', '#E2A84F', '#8E5A8E'], ['#8F8A9A', '#B9A27E', '#6F7FA8'], ['#B8C6DE', '#E8ECF4', '#8B84C0']

    function rnd(i) { var x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); }
    var list = [], years = [];
    for (var y = 2009; y <= 2026; y++) { var n = 0; for (var m = 0; m < 12; m++) { if (y === 2026 && m > 10) break; list.push({ y: y, m: m }); n++; } years.push({ y: String(y), n: n }); }
    var N = list.length, dabs = [];
    list.forEach(function (it, t) {
      var i = it.y * 12 + it.m, sparse = it.y < 2012 && rnd(i) < 0.4;
      var trip = it.m >= 5 && it.m <= 8 && rnd(i + 1) > 0.8;
      var cols = trip ? ['#2F6FAE', '#7FC2D6', '#F0D18A'] : P[it.m];
      var count = sparse ? 1 : 3 + Math.floor(rnd(i + 3) * 2);
      for (var k = 0; k < count; k++) {
        var a = rnd(i * 7 + k), b = rnd(i * 13 + k), c = rnd(i * 17 + k);
        dabs.push({ s: 'left: ' + ((t + a * 1.3 - 0.15) / N * 100).toFixed(2) + '%; top: ' + (4 + b * 76).toFixed(1) + '%; width: ' + (11 + c * 12).toFixed(1) + 'px; height: ' + (5 + a * 4).toFixed(1) + 'px; background: ' + cols[k % 3] + '; opacity: ' + (sparse ? .45 : .92) + '; transform: rotate(' + ((c - 0.5) * 10).toFixed(1) + 'deg)' });
      }

    function face(o) {
      var s = o.s || 1, x = o.x || 50, y = o.y || 46, L = [];
      if (o.hat) L.push('radial-gradient(ellipse ' + (24 * s) + '% ' + (13 * s) + '% at ' + x + '% ' + (y - 17 * s) + '%, ' + o.hat + ' 0 95%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (18 * s) + '% ' + (22 * s) + '% at ' + x + '% ' + y + '%, ' + o.skin + ' 0 96%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (22 * s) + '% ' + (21 * s) + '% at ' + x + '% ' + (y - 9 * s) + '%, ' + o.hair + ' 0 96%, transparent 100%)');
      L.push('radial-gradient(ellipse ' + (40 * s) + '% ' + (28 * s) + '% at ' + x + '% ' + (y + 56 * s) + '%, ' + o.shirt + ' 0 96%, transparent 100%)');

    }
    var S = {
      lake: 'radial-gradient(ellipse 14% 7% at 30% 64%, #7FAE5E 0 95%, transparent 100%), radial-gradient(circle at 31% 62%, #F2B8C6 0 2%, transparent 2.6%), radial-gradient(ellipse 11% 6% at 72% 80%, #6E9F55 0 95%, transparent 100%), radial-gradient(circle at 73% 78%, #F7E4EA 0 1.8%, transparent 2.4%), linear-gradient(180deg, #4E7E78 0%, #3D6A80 55%, #2E5571 100%)',

      lakeEve: 'radial-gradient(circle at 62% 42%, #F7A35C 0 4.5%, transparent 5%), linear-gradient(180deg, transparent 0 53.0%, #9A7FA0 53.0%, #4F5A84 100%), conic-gradient(from 134deg at 30% 40.0%, #5A587A 0 92deg, transparent 92deg), linear-gradient(180deg, #E7B58E 0%, #F0CFA8 42%, #9A7FA0 53%, #4F5A84 100%)',
      meadow: 'radial-gradient(circle at 24% 78%, #E9A3B5 0 2%, transparent 2.5%), radial-gradient(circle at 62% 86%, #F2D06B 0 1.6%, transparent 2.1%), radial-gradient(circle at 80% 72%, #E9A3B5 0 1.6%, transparent 2.1%), linear-gradient(180deg, #BCD3E6 0%, #DCE6EE 38%, #A3BE74 40%, #6F9446 100%)',
      autumn: 'radial-gradient(circle at 25% 30%, #E39A4A 0 16%, transparent 17%), radial-gradient(circle at 70% 25%, #C9622E 0 18%, transparent 19%), radial-gradient(circle at 50% 45%, #B9472A 0 12%, transparent 13%), linear-gradient(180deg, #D9C4A0 0%, #8C6A45 70%, #5E4630 100%)',
